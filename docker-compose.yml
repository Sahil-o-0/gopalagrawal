version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gopal_backend
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/fleet_app.db
    ports:
      # Map VPS port 8000 to FastAPI backend on port 8000
      - "8000:8000"
    restart: always

volumes:
  backend_data:
