services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gopal_backend
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/fleet_app.db
    ports:
      - "8000:8000"
    restart: always

  caddy:
    image: caddy:latest
    container_name: gopal_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  backend_data:
  caddy_data:
  caddy_config:
