version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gopal_backend
    volumes:
      - backend_data:/app
    environment:
      - DATABASE_URL=sqlite:///./fleet_app.db
    ports:
      # Map HTTP port 80 directly to FastAPI on port 8000
      - "80:8000"
    restart: always

volumes:
  backend_data:
